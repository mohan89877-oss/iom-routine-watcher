name: Check IOM Exam Routines

on:
  workflow_dispatch: {}

permissions:
  contents: write

# Triggers come every ~5 minutes from an external cron. Never let two runs
# overlap, or they could race on state.json.
concurrency:
  group: check-routines
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python check_routines.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state.json"
          git push
